[project]
name = "pipeline_project"
version = "0.1.0"
description = ""
requires-python = ">=3.11,<4.0"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.10,<0.17.0"
mypy = ">=2.4.0,<3.0.0"
bandit = ">=1.9.4,<2.0.0"
radon = ">=6.0.1,<7.0.0"
pre-commit = ">=4.6.2,<5.0.0"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true